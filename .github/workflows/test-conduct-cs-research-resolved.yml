name: Test resolved conduct-cs-research

on:
  push:
    branches:
      - artifact/conduct-cs-research-resolved-20260831
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile runtime scripts
        run: python -B -m py_compile deliverables/conduct-cs-research-integrated-2026-08-30/conduct-cs-research/scripts/*.py
      - name: Run external regression suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          SKILL_UNDER_TEST: ${{ github.workspace }}/deliverables/conduct-cs-research-integrated-2026-08-30/conduct-cs-research
        run: python -B deliverables/conduct-cs-research-integrated-2026-08-30/tools/tests/test_skill.py
