name: Build final-audited conduct-cs-research release

on:
  push:
    branches:
      - artifact/conduct-cs-research-final-audit-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out final-audit branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run final validation, adversarial tests, overengineering checks, and packaging
        run: python deliverables/conduct-cs-research-integrated-2026-08-30/tools/final_release.py

      - name: Upload certified release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conduct-cs-research-final-audited-2026-08-30
          path: deliverables/conduct-cs-research-integrated-2026-08-30/release/*
          if-no-files-found: error
          retention-days: 30
